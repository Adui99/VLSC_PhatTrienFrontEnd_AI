<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyen doi nhiet do</title>
</head>

<body>
    <h2>Chuong trinh chuyen doi nhiet do</h2>
    <label>Nhap vao do C</label>
    <input type="number" id="doC">
    <button onclick="convert()">Convert</button>
    <p id="result"></p>

    <script>
        function convert() {
            let doC = document.getElementById("doC").value;
            let doF = (doC * 9 / 5) + 32;
            document.getElementById("result").innerHTML = doC + " do C = " + doF + " do F";
        }
    </script>
</body>

</html>
