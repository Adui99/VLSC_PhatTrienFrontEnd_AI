<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinh chi so BMI</title>
</head>

<body>
    <h2>Chuong trinh tinh chi so BMI</h2>
    <label>Nhap vao chieu cao (m)</label>
    <input type="number" id="height">
    <br>
    <label>Nhap vao can nang (kg)</label>
    <input type="number" id="weight">
    <br>
    <button onclick="calculateBMI()">Calculate</button>
    <p id="result">KET QUA: </p>

    <script>
        function calculateBMI() {
            let height = document.getElementById("height").value;
            let weight = document.getElementById("weight").value;
            let bmi = weight / (height * height);
            document.getElementById("result").innerHTML = "KET QUA: " + bmi;
            if (bmi < 18.5) {
                document.getElementById("result").innerHTML = "Underweight";
            }
            else if (bmi < 25) {
                document.getElementById("result").innerHTML = "Normal weight";
            }
            else if (bmi < 30) {
                document.getElementById("result").innerHTML = "Overweight";
            }
            else {
                document.getElementById("result").innerHTML = "Obesity";
            }
        }
    </script>
</body>

</html>
